<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>Ders Videosu Stüdyosu</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!--
  Ders Videosu Stüdyosu v4 — tek dosya, sunucu gerekmez.
  v3'e göre: kayıt sırasında kalem gecikmesi giderildi.
   - Tahta katmanlara ayrıldı (taban / mürekkep / arayüz). Çizilen çizgi her karede baştan değil,
     sadece yeni parçasıyla çiziliyor.
   - Kayıt görüntüsü her karede baştan çizilmiyor; sadece değişen bölge (yeni çizgi, imleç, kamera)
     tek seferde ve ölçeklemeden kopyalanıyor.
   - Kalemin havada gezinmesi artık tüm tahtayı yeniden çizdirmiyor.
-->
<style>
:root{--bg:#161817;--pan:#202321;--ln:#34393a;--fg:#ecece6;--ac:#e8d9a0;--ok:#7fd1a0;--topH:42px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;font-size:12px;color:var(--fg);background:var(--pan);border:1px solid var(--ln);border-radius:7px;padding:5px 9px;cursor:pointer;white-space:nowrap;flex:none;touch-action:manipulation}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#1b1b17;border-color:var(--ac)}button.go{background:var(--ok);color:#102016;border-color:var(--ok);font-weight:600}
button:disabled{opacity:.55;cursor:default}button:disabled:hover{border-color:var(--ln)}
input[type=text]{background:#111312;color:var(--fg);border:1px solid var(--ln);border-radius:7px;padding:8px;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#top{height:var(--topH);display:flex;align-items:center;gap:4px;padding:4px 6px}
#bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1;align-items:center;min-width:0}#bar::-webkit-scrollbar{display:none}
#st{color:#a9aea8;padding:0 6px;flex:none;max-width:160px;overflow:hidden;text-overflow:ellipsis}#tabs,#pn{display:flex;gap:6px;align-items:center}
#ver{color:#6d726d;font-size:11px;padding:0 6px;flex:none}
#toast{position:fixed;top:calc(var(--topH) + 10px);left:50%;transform:translateX(-50%);background:#7a2b2b;color:#fff;padding:8px 14px;border-radius:10px;z-index:12;cursor:pointer;max-width:92vw;text-align:center}
#mm{position:fixed;inset:0;background:#000c;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px}#mm>div{background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center;max-width:92vw}
#mh{position:fixed;z-index:8;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#1b1b17;border-radius:6px;cursor:grab;touch-action:none;user-select:none}
#fb{position:fixed;z-index:8;background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:4px 6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:calc(100vw - 8px)}#fb button{padding:4px 8px}
#te{position:fixed;z-index:7;background:rgba(128,128,128,.15);border:1px dashed #e8d9a0;outline:0;resize:none;overflow:hidden;margin:0;line-height:1.25;touch-action:manipulation}
#sb{position:fixed;z-index:6;background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:4px 6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:calc(100vw - 8px)}
#stage{position:absolute;overflow:hidden;touch-action:none}
#wrapS{position:fixed;left:0;right:0;top:var(--topH);bottom:0;display:flex;align-items:center;justify-content:center;padding:6px}
#studio{position:relative;width:min(100%,calc((100% - 12px)*16/9));max-height:100%;aspect-ratio:16/9;background:#000}#lay{width:100%;height:100%;display:block}
#ink,#ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden}
#plas{position:absolute;left:0;top:0;pointer-events:none;display:none;will-change:transform;width:64px;height:72px}
#camV{position:absolute;object-fit:cover;background:#0a0c0b;box-sizing:border-box}
#sp{position:fixed;right:10px;top:calc(var(--topH) + 8px);width:min(320px,92vw);max-height:calc(100% - var(--topH) - 16px);overflow:auto;-webkit-overflow-scrolling:touch;z-index:9;background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
#sp label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#b8bdb6}#sp label.ck{flex-direction:row;align-items:center;gap:6px}
#sp input[type=text],#sp input[type=number],#sp select{background:#111312;color:var(--fg);border:1px solid var(--ln);border-radius:7px;padding:6px;font:inherit;width:100%}
#sp input[type=color]{width:100%;height:32px;border:1px solid var(--ln);border-radius:7px;background:#111312}.two{display:flex;gap:8px}.two>label{flex:1}#lv{width:100%;height:10px;background:#111312;border-radius:5px}
#cd{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;font:700 min(160px,36vw) Georgia,serif;color:#fff;text-shadow:0 0 30px #000;pointer-events:none}
#rd{position:fixed;inset:0;background:#000c;z-index:13;display:flex;align-items:center;justify-content:center;padding:12px}#rd>div{background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center;max-width:92vw}
#tm{color:#e8d9a0;font-variant-numeric:tabular-nums;padding:0 4px;flex:none}#cv{width:100%;height:100%;touch-action:none;display:block}
#tb{position:fixed;z-index:5;background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:5px;display:flex;gap:4px;scrollbar-width:none;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:none}#tb::-webkit-scrollbar{display:none}
#tb.v{flex-direction:column;max-height:calc(100% - var(--topH) - 16px)}#tb.h{max-width:calc(100% - 16px)}
#tb button{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center}
#hd{cursor:grab;text-align:center;color:#888;touch-action:none;user-select:none;flex:none;line-height:10px;padding:2px 6px}
#pop{position:fixed;z-index:6;background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:8px;width:min(210px,calc(100vw - 8px));max-height:calc(100% - var(--topH) - 12px);overflow:auto}
#pop label{display:block;margin:4px 0}#pop input[type=range]{width:100%;height:26px}
.sw i{width:24px;height:24px;border-radius:50%;display:inline-block;margin:3px;border:2px solid transparent;cursor:pointer}.sw i.on{border-color:#fff}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:4px}.gr button{padding:6px 4px}
@media (pointer:coarse),(max-width:1024px){
  :root{--topH:46px}
  #tb button{width:40px;height:40px}
  #bar button{min-height:36px;padding:7px 11px}
  #hd{padding:8px 10px}
  #ver{display:none}
}
@media (max-height:520px) and (pointer:coarse){
  :root{--topH:40px}
  #tb button{width:34px;height:34px}
  #bar button{min-height:32px;padding:5px 9px}
}
</style></head><body>
<div id="app">
 <div id="top"><button onclick="bar.scrollBy(-220,0)">‹</button>
  <div id="bar">
   <button id="bsp" onclick="$('sp').hidden=!$('sp').hidden">Kayıt Ayarları</button>
   <button id="brs" class="go" onclick="recStart()">● Kaydı Başlat</button><button id="brp" onclick="recPause()" disabled>Duraklat</button><button id="bre" onclick="recStop()" disabled>Bitir</button><span id="tm">0:00</span><span id="dg" style="color:#8f948d;padding:0 4px;flex:none"></span>
   <input id="mk" type="text" placeholder="Bölüm adı" size="14" onkeydown="if(event.key==='Enter')addMark()"><button onclick="addMark()">Bölüm İşareti</button>
   <button onclick="$('fi').click()">Dosya Ekle</button><input id="fi" type="file" accept="application/pdf,image/*" multiple hidden onchange="addFiles([...this.files]);this.value=''"><span id="tabs"></span><span id="pn" hidden><button onclick="pageGo(-1)">‹ Önceki</button><button id="pl" title="Sayfayı sığdır" onclick="pfit()">1 / 1</button><button onclick="pageGo(1)">Sonraki ›</button></span>
   <button id="bzo" onclick="zoom(1/1.2)">−</button><button id="bzi" onclick="zoom(1.2)">+</button><button id="bzf" onclick="z=1;view()">Enine Sığdır</button>
   <button onclick="openCast()">Çekim Penceresi</button><button id="bf" onclick="fs()">Tam Ekran</button><button id="bpo" title="Açıkken kalem çizer, parmak tahtayı kaydırır" onclick="penOnly=!penOnly;this.classList.toggle('on',penOnly);this.textContent='Kalem Modu: '+(penOnly?'Açık':'Kapalı')">Kalem Modu: Kapalı</button>
  </div><button onclick="bar.scrollBy(220,0)">›</button><span id="st"></span><span id="ver">Stüdyo v4</span></div>
 <div id="wrapS"><div id="studio"><canvas id="lay" width="1920" height="1080"></canvas><div id="stage"><canvas id="cv"></canvas><canvas id="ink"></canvas><canvas id="ui"></canvas><canvas id="plas"></canvas></div><video id="camV" autoplay muted playsinline></video></div></div>
 <div id="cd" hidden></div>
 <div id="sp"><b>Kayıt ayarları</b>
  <label>Ders adı<input id="f_c" type="text"></label><label>Konu<input id="f_t" type="text"></label>
  <div class="two"><label>Gün<input id="f_d" type="number" min="1"></label><label>Adım<input id="f_s" type="number" min="1"></label></div>
  <label>Logo<input id="f_l" type="file" accept="image/*"></label>
  <div class="two"><label>Tema rengi<input id="f_th" type="color"></label><label>Çerçeve rengi<input id="f_fr" type="color"></label></div>
  <label>Kamera<select id="f_cam"></select></label><label>Mikrofon<select id="f_mic"></select></label><canvas id="lv" width="260" height="10"></canvas>
  <div class="two"><label class="ck"><input id="f_cs" type="checkbox">Kamerayı göster</label><label>Oran<select id="f_ca"><option>4:3</option><option>16:9</option><option>1:1</option><option>3:4</option></select></label></div>
  <label>Sol sütun<select id="f_col"><option value="dar">Dar</option><option value="orta">Orta</option></select></label>
  <label>Kayıt biçimi<select id="f_fm"><option value="auto">Otomatik (MP4 öncelikli)</option><option value="mp4">MP4 (H.264)</option><option value="vp8">WebM (VP8)</option><option value="vp9">WebM (VP9)</option></select></label>
  <label>Çözünürlük<select id="f_r"><option value="1080">1080p</option><option value="720">720p</option></select></label>
  <label class="ck"><input id="f_in" type="checkbox">Başlangıçta 3 sn açılış kartı</label><div id="fmt" style="color:#8f948d"></div><button onclick="$('sp').hidden=1">Kapat</button></div>
 <div id="rd" hidden><div><b>Kayıt hazır</b><div id="rdi"></div><div class="row"><button class="go" onclick="dlVideo()">Videoyu indir</button><button onclick="dlMarks()">Bölümleri indir (.txt)</button></div><div class="row"><button onclick="newVid()">Yeni video (adım +1)</button><button onclick="$('rd').hidden=1">Kapat</button></div></div></div>
 <div id="tb" class="v"><div id="hd" title="Taşı">⠿</div></div><div id="pop" hidden></div>
 <div id="toast" hidden onclick="this.hidden=1"></div>
 <div id="mm" hidden><div><b>Belge nasıl gösterilsin?</b><div class="row"><button class="go" data-v="all">Tüm sayfalar alt alta</button><button data-v="one">Sayfa sayfa (slayt)</button></div></div></div>
 <div id="mh" hidden title="Taşı">⠿</div><div id="fb" hidden><button data-b="f-">A−</button><button data-b="f+">A+</button><button data-b="b"><b>B</b></button><button data-b="i"><i>I</i></button><button data-b="fam">Aa</button><button data-b="al">≡</button><span class="sw"><i data-bc="0"></i><i data-bc="1"></i><i data-bc="2"></i><i data-bc="3"></i><i data-bc="4"></i><i data-bc="5"></i></span></div>
 <div id="sb" hidden><button data-a="del">Sil</button><span id="tx2" hidden><button data-a="f-">A−</button><button data-a="f+">A+</button><button data-a="b"><b>B</b></button><button data-a="i"><i>I</i></button><button data-a="fam">Aa</button><button data-a="al">≡</button></span><span class="sw"><i data-c="0"></i><i data-c="1"></i><i data-c="2"></i><i data-c="3"></i><i data-c="4"></i><i data-c="5"></i></span></div>
</div>
<script>
'use strict';
/* =====================================================================
   Sabitler ve durum
   ===================================================================== */
const $ = id => document.getElementById(id), bar = $('bar'), cv = $('cv'), inkC = $('ink'), uiC = $('ui');
const PW = 800, PH = 1131, GAP = 24, M = 24;                       // sayfa genişliği/yüksekliği (dünya birimi)
const PAL = [['#f4f3ec', '#f2d96b', '#7fc4f0', '#f09ab8', '#8fe0a4', '#f2a36b'], ['#1b1b1b', '#b58a00', '#1f6fb5', '#c2306a', '#2e8b4f', '#d2691e']];
const S = { tx: { fam: 'sans', fs: 28, b: 0, i: 0, c: 0, al: 'c' }, pen: { w: 2.5, c: 0, d: 0 }, hl: { w: 20, c: 1 }, er: { w: 24, m: 'part' }, sh: { w: 2.5, c: 0, t: 'line', a: 1, f: 0 } };
const SH = [['line', 'Çizgi'], ['dash', 'Kesikli'], ['arrow', 'Ok'], ['rect', 'Dörtgen'], ['tri', 'Üçgen'], ['rtri', 'Dik üçgen'], ['ell', 'Elips/Daire']];
const TH = [['b', 'Siyah'], ['bg', 'Siyah kareli'], ['w', 'Beyaz'], ['wg', 'Beyaz kareli']];
const FILL = ['rect', 'tri', 'rtri', 'ell'], ALS = ['l', 'c', 'r', 'j'];
const FAM = { sans: 'Arial,Helvetica,sans-serif', serif: 'Georgia,"Times New Roman",serif', mono: '"Courier New",monospace', hand: '"Comic Sans MS","Segoe Print","Bradley Hand",cursive' }, FK = Object.keys(FAM);
const mg = document.createElement('canvas').getContext('2d');

let objs = [], cur = null, hist = [], redo = [], theme = 'b';
let pg = [{ h: PH }, { h: PH }, { h: PH }], sheets = [{ pg }], cs = 0;
let z = 1, ox = 0, oy = 0, cw = 1, ch = 1;
let tool = 'pen', mode = 'pan', penOnly = false, shapeRec = true;
let sel = [], sm = 0, sa, so = {}, sb_, sh_, selR = null;
let laser = null, te = null, editId = null, tp = null, teObj = null;
let dn = false, fp = false, last = null, start = null, tt = 0, perfect = 0, recDone = 0, ht = 0, ha = null, lp = null;
let ptrs = {}, pinch = null, uid = 0, side = 'l', pt_ = null, pb = null, rct = null;
// çizim döngüsü bayrakları
let viewDirty = 1, baseRegion = null, curDirty = 0, uiDirty = 1, ovVer = 0;

const dark = () => !cs && theme[0] === 'b', pal = () => PAL[dark() ? 0 : 1], sc = () => cw / (PW + 2 * M) * z, note = t => $('st').textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uni = (a, b) => !a ? b : !b ? a : [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])];
const inter = (a, b) => a && b && a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
function fs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen() }
document.onfullscreenchange = () => $('bf').textContent = document.fullscreenElement ? 'Tam Ekranı Kapat' : 'Tam Ekran';

/* =====================================================================
   Görünüm (kaydırma / yakınlaştırma)
   ===================================================================== */
const dhf = () => pg.reduce((a, p) => a + p.h + GAP, 0), ptop = i => pg.slice(0, i).reduce((a, p) => a + p.h + GAP, 0);
function clamp() {
  const s = sc(), vw = cw / s, vh = ch / s, dh = dhf();
  ox = vw >= PW + 2 * M ? -(vw - PW) / 2 : Math.min(Math.max(ox, -M), PW + M - vw);
  const sh = sheets[cs];
  if (sh && sh.one) { const pi = sh.pi || 0, t = ptop(pi), h = pg[pi].h; oy = vh >= h + 2 * M ? t - (vh - h) / 2 : Math.min(Math.max(oy, t - M), t + h + M - vh) }
  else oy = Math.min(Math.max(oy, -M), Math.max(-M, dh - vh + M));
  if (!cs && oy + vh > dh - PH * .3) pg.push({ h: PH });
  viewDirty = 1;
}
function view() { clamp() }
function zoomAt(cx, cy, f) { const r = cv.getBoundingClientRect(), p = pt({ clientX: cx, clientY: cy }); z = Math.min(5, Math.max(.2, z * f)); const s = sc(); ox = p[0] - (cx - r.left) / s; oy = p[1] - (cy - r.top) / s; view() }
function zoom(f) { const r = cv.getBoundingClientRect(); zoomAt(r.left + cw / 2, r.top + ch / 2, f) }
const rect = () => rct || (rct = cv.getBoundingClientRect());
const pt = e => { const r = rect(), s = sc(); return [(e.clientX - r.left) / s + ox, (e.clientY - r.top) / s + oy] };
addEventListener('resize', () => rct = null); addEventListener('scroll', () => rct = null, true);

/* =====================================================================
   Nesne geometrisi ve çizimi (Path2D önbellekli)
   ===================================================================== */
function poly(o) {
  const { x1, y1, x2, y2 } = o, mx = (x1 + x2) / 2;
  switch (o.t) {
    case 'text': case 'rect': return [[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]];
    case 'tri': return [[mx, y1], [x2, y2], [x1, y2], [mx, y1]];
    case 'rtri': return [[x1, y1], [x1, y2], [x2, y2], [x1, y1]];
    case 'ell': { const a = []; for (let i = 0; i <= 48; i++) { const t = i / 48 * 6.2832; a.push([mx + Math.cos(t) * (x2 - x1) / 2, (y1 + y2) / 2 + Math.sin(t) * (y2 - y1) / 2]) } return a }
    default: return [[x1, y1], [x2, y2]];
  }
}
function buildPath(o) {
  const P = new Path2D(), p = o.p || poly(o);
  if (o.p && !o.sh && !o.ds && p.length > 2) {   // serbest çizim: yumuşatılmış eğri (kesikli kalem düz parçalarla)
    P.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) P.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
    P.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
  } else {
    p.forEach((q, i) => i ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1]));
    if (p.length === 1) P.lineTo(p[0][0] + .01, p[0][1]);
  }
  if (o.t === 'arrow') { const a = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), l = 10 + o.w * 2; for (const d of [-.45, .45]) { P.moveTo(o.x2, o.y2); P.lineTo(o.x2 - l * Math.cos(a + d), o.y2 - l * Math.sin(a + d)) } }
  return P;
}
// Nesneler değişmez (her değişiklikte yeni nesne oluşur), bu yüzden yol ve sınır kutusu önbelleklenebilir.
const PC = new WeakMap(), BB = new WeakMap();
function objPath(o) { let p = PC.get(o); if (!p) { p = buildPath(o); PC.set(o, p) } return p }
function ob(o) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const q of (o.p || poly(o))) { if (q[0] < a) a = q[0]; if (q[1] < b) b = q[1]; if (q[0] > c) c = q[0]; if (q[1] > d) d = q[1] } return [a, b, c, d] }
function boxOf(o) {
  if (o.t === 'text') { const p = o.fs * .35 + 6; return [o.x1 - p, o.y1 - p, o.x2 + p, o.y2 + p] }
  const q = ob(o), p = o.w / 2 + 2 + (o.t === 'arrow' ? 10 + o.w * 2 : 0); return [q[0] - p, q[1] - p, q[2] + p, q[3] + p];
}
function bbox(o) { let b = BB.get(o); if (!b) { b = boxOf(o); BB.set(o, b) } return b }
const fnt = o => `${o.i ? 'italic ' : ''}${o.b ? 'bold ' : ''}${o.fs}px ${FAM[o.fam]}`;
function drawText(g, o) {
  g.save(); g.fillStyle = pal()[o.c]; g.font = fnt(o); g.textBaseline = 'top'; const al = o.al || 'l', W = o.x2 - o.x1 - 8;
  o.lines.forEach((l, i) => {
    const y = o.y1 + 4 + i * o.fs * 1.25;
    if (al === 'j' && !(o.ends && o.ends[i]) && l.includes(' ')) { const w = l.split(' '), tw = w.reduce((a, x) => a + g.measureText(x).width, 0), gp = (W - tw) / (w.length - 1); let x = o.x1 + 4; g.textAlign = 'left'; w.forEach(wd => { g.fillText(wd, x, y); x += g.measureText(wd).width + gp }) }
    else { g.textAlign = al === 'c' ? 'center' : al === 'r' ? 'right' : 'left'; g.fillText(l, al === 'c' ? o.x1 + 4 + W / 2 : al === 'r' ? o.x2 - 4 : o.x1 + 4, y) }
  }); g.restore();
}
